name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@efd9d3202653a8ff8e41995ad8225c9f77a19a98
        with:
          cache-paths: |
            .cache/go-build
            .cache/golangci-lint
            go/pkg/mod
          cache-key-files: go.sum
          command: just check

  integration:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@efd9d3202653a8ff8e41995ad8225c9f77a19a98
        with:
          apt-packages: bubblewrap openssh-client python3
          cache-paths: |
            .cache/go-build
            go/pkg/mod
          cache-key-files: go.sum
          command: just test-integration

  vulnerabilities:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@efd9d3202653a8ff8e41995ad8225c9f77a19a98
        with:
          cache-paths: |
            .cache/go-build
            go/pkg/mod
          cache-key-files: go.sum
          command: just vuln

  site:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@efd9d3202653a8ff8e41995ad8225c9f77a19a98
        with:
          cache-paths: .npm
          cache-key-files: site/package-lock.json
          command: just site-build

  package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@efd9d3202653a8ff8e41995ad8225c9f77a19a98
        with:
          dev-shell: ""
          command: nix build .#default

  flake-checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@efd9d3202653a8ff8e41995ad8225c9f77a19a98
        with:
          dev-shell: ""
          command: nix flake check --print-build-logs
