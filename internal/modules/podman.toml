# A podman service for this session, in its own user namespace. Containers
# share the session's network: they reach the internet only through the
# proxy, and the agent reaches their ports on localhost.

[podman]
enabled = true
# Images containers may use. A profile adds to this list, and "*" allows any
# image. The first pull of each tag pins the digest it resolved to.
images = [
  # Docker's official images, such as postgres or node.
  "docker.io/library/*",
  # Images built or loaded in the session.
  "localhost/*",
  # Playwright's browsers, for end-to-end suites.
  "mcr.microsoft.com/playwright",
  "mcr.microsoft.com/playwright/*",
  # Testcontainers starts these beside the containers a test asks for.
  "docker.io/testcontainers/ryuk",
  "docker.io/testcontainers/sshd",
]

[egress]
allow = [
  "docker.io",
  "registry-1.docker.io",
  "auth.docker.io",
  "production.cloudflare.docker.com",
  "production.cloudfront.docker.com",
  "ghcr.io",
  "quay.io",
  "cdn01.quay.io",
  "cdn02.quay.io",
  "cdn03.quay.io",
]
