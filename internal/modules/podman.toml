description = "A podman service for the session, behind a broker that checks each call."
[podman]
enabled = true
images = [
  "docker.io/library/*",
  "localhost/*",
  "mcr.microsoft.com/playwright",
  "mcr.microsoft.com/playwright/*",
  "docker.io/testcontainers/ryuk",
  "docker.io/testcontainers/sshd",
]

[egress]
allow = [
  "docker.io",
  "registry-1.docker.io",
  "auth.docker.io",
  "production.cloudflare.docker.com",
  "production.cloudfront.docker.com",
  "ghcr.io",
  "quay.io",
  "cdn01.quay.io",
  "cdn02.quay.io",
  "cdn03.quay.io",
]
