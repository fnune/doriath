# Bitbucket Cloud with a token the agent never sees, and that only git and
# git-lfs get on bitbucket.org and only curl gets on api.bitbucket.org. Use a repository or workspace access token. Reads and
# routine work on pull requests go through. Merges, pushes and other writes
# wait for approval, and changes to webhooks, Pipelines and deployment variables,
# deploy keys, branch restrictions and permissions are refused. Say where the token comes from under [secrets.bitbucket]
# in the profile.

[[http]]
host = "bitbucket.org"
credential = { secret = "bitbucket", scheme = "basic", username = "x-token-auth", binaries = ["git-remote-https", "git-remote-http", "git", "git-lfs"] }
default = "approve"
# The API names ssh.bitbucket.org in its clone links.
ssh = { user = "git", hosts = ["ssh.bitbucket.org"] }

# git over HTTPS. Fetches pass, and each push waits for approval, which you
# can grant for the session per repository. A Git LFS upload waits at the
# batch request, which names the objects.

[[http.rules]]
method = "GET"
path = "/**"
action = "allow"

[[http.rules]]
method = "HEAD"
path = "/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/git-upload-pack"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/objects/batch"
body_contains = ['"operation":"upload"', '"operation": "upload"']
action = "approve"
summary = "Upload Git LFS objects"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/objects/batch"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/locks/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/git-receive-pack"
action = "approve"
summary = "Push to a Bitbucket repository"

[[http]]
host = "api.bitbucket.org"
credential = { secret = "bitbucket", scheme = "bearer", binaries = ["curl"] }
default = "approve"
repositories = ["/2.0/repositories/*/*"]

# Refused outright.

[[http.rules]]
method = "*"
path = "/2.0/repositories/*/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/2.0/repositories/*/*/pipelines_config/variables/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/2.0/repositories/*/*/deploy-keys/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/2.0/repositories/*/*/branch-restrictions/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/2.0/repositories/*/*/permissions-config/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/2.0/repositories/*/*/deployments_config/environments/*/variables/**"
action = "deny"

[[http.rules]]
method = "DELETE"
path = "/2.0/repositories/*/*"
action = "deny"

[[http.rules]]
method = "*"
path = "/2.0/workspaces/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/2.0/workspaces/*/pipelines-config/variables/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/2.0/workspaces/*/projects/*/deploy-keys/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/2.0/workspaces/*/projects/*/permissions-config/**"
action = "deny"

# Held with a summary that says what the request does.

[[http.rules]]
method = "PUT"
path = "/2.0/repositories/*/*"
action = "approve"
summary = "Change the repository's settings"

[[http.rules]]
method = "POST"
path = "/2.0/repositories/*/*/pullrequests/*/merge"
action = "approve"
summary = "Merge a pull request"

# Reads, and routine work on pull requests.

[[http.rules]]
method = "GET"
path = "/**"
action = "allow"

[[http.rules]]
method = "HEAD"
path = "/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/2.0/repositories/*/*/pullrequests"
action = "allow"

[[http.rules]]
method = "PUT"
path = "/2.0/repositories/*/*/pullrequests/*"
action = "allow"

[[http.rules]]
method = "POST"
path = "/2.0/repositories/*/*/pullrequests/*/comments"
action = "allow"

[[http.rules]]
method = "PUT"
path = "/2.0/repositories/*/*/pullrequests/*/comments/*"
action = "allow"

[[http.rules]]
method = "*"
path = "/2.0/repositories/*/*/pullrequests/*/approve"
action = "allow"

[[http.rules]]
method = "*"
path = "/2.0/repositories/*/*/pullrequests/*/request-changes"
action = "allow"

[[http.rules]]
method = "POST"
path = "/2.0/repositories/*/*/pullrequests/*/decline"
action = "allow"
