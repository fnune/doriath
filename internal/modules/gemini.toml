description = "Google's Gemini CLI, with its own login and your settings read-only."
[env]
set = { NO_BROWSER = "true" }

[[caches]]
path = "~/.gemini"

[[mounts]]
path = "~/.gemini/commands"
missing = "skip"

[[mounts]]
path = "~/.gemini/skills"
missing = "skip"

[[mounts]]
path = "~/.gemini/agents"
missing = "skip"

[[mounts]]
path = "~/.gemini/policies"
missing = "skip"

[[mounts]]
path = "~/.agents/skills"
missing = "skip"

[agent]
instructions = ["~/.gemini/GEMINI.md"]

[egress]
allow = ["oauth2.googleapis.com", "www.googleapis.com", "cloudcode-pa.googleapis.com", "generativelanguage.googleapis.com"]
