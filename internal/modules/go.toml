description = "The Go module proxy and checksum database, with the build and module caches."
[[caches]]
path = "~/.cache/go-build"

[[caches]]
path = "~/go/pkg/mod"

[[caches]]
path = "~/.cache/golangci-lint"

[env]
pass = ["GOPRIVATE", "GONOSUMDB", "GONOPROXY", "GOFLAGS"]

[egress]
allow = ["proxy.golang.org", "sum.golang.org"]
