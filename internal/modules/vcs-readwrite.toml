description = "The repository the session starts in, writable, with the files of git, mise and agents kept read-only."
[vcs]
store = true

[[mounts]]
path = "{repository}"
mode = "write"

[[mounts]]
path = "{git}/config"
edit = { format = "git-config", safe = [
  "branch.*.remote = *",
  "branch.*.merge = refs/heads/**",
] }

[[mounts]]
path = "~/.config/jj"
missing = "skip"

[[mounts]]
path = "{repository}/mise.toml"
missing = "skip"

[[mounts]]
path = "{repository}/.mise.toml"
missing = "skip"

[[mounts]]
path = "{repository}/mise.local.toml"
missing = "skip"

[[mounts]]
path = "{repository}/.mise"
missing = "skip"

[[mounts]]
path = "{repository}/.tool-versions"
missing = "skip"

[[mounts]]
path = "{repository}/.claude/settings.json"
missing = "hold"

[[mounts]]
path = "{repository}/.claude/settings.local.json"
missing = "hold"

[[mounts]]
path = "{repository}/.mcp.json"
missing = "hold"

[[mounts]]
path = "{repository}/.codex"
missing = "skip"

[[mounts]]
path = "{repository}/.gemini"
missing = "skip"

[[mounts]]
path = "{repository}/opencode.json"
missing = "skip"

[[mounts]]
path = "{repository}/.opencode"
missing = "skip"
