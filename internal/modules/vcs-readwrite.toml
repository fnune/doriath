[[mounts]]
path = "{repository}/.mcp.json"
missing = "hold"

[[mounts]]
path = "{repository}/.codex"
missing = "skip"

[[mounts]]
path = "{repository}/.gemini"
missing = "skip"

[[mounts]]
path = "{repository}/opencode.json"
missing = "skip"

[[mounts]]
