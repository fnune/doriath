description = "The repository the session starts in, writable, with the files your machine runs kept read-only."
[vcs]
store = true

[[mounts]]
path = "{repository}"
mode = "write"

[[mounts]]
path = "{git}/config"
edit = { format = "git-config", safe = [
  "branch.*.remote = *",
  "branch.*.merge = refs/heads/**",
] }

[[mounts]]
path = "~/.config/jj"
missing = "skip"

[[mounts]]
path = "{repository}/.envrc"
missing = "skip"

[[mounts]]
path = "{repository}/.direnv"
missing = "skip"

[[mounts]]
path = "{repository}/flake.nix"
missing = "skip"

[[mounts]]
path = "{repository}/flake.lock"
missing = "skip"

[[mounts]]
path = "{repository}/shell.nix"
missing = "skip"

[[mounts]]
path = "{repository}/devenv.nix"
missing = "skip"

[[mounts]]
path = "{repository}/devenv.yaml"
missing = "skip"

[[mounts]]
path = "{repository}/devenv.lock"
missing = "skip"

[[mounts]]
path = "{repository}/mise.toml"
missing = "skip"

[[mounts]]
path = "{repository}/.mise.toml"
missing = "skip"

[[mounts]]
path = "{repository}/mise.local.toml"
missing = "skip"

[[mounts]]
path = "{repository}/.mise"
missing = "skip"

[[mounts]]
path = "{repository}/.tool-versions"
missing = "skip"

[[mounts]]
path = "{repository}/.vscode"
missing = "hold"

[[mounts]]
path = "{repository}/.idea"
missing = "skip"

[[mounts]]
path = "{repository}/.zed"
missing = "skip"

[[mounts]]
path = "{repository}/.helix"
missing = "skip"

[[mounts]]
path = "{repository}/.nvim.lua"
