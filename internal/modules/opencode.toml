description = "opencode, with its own data and your config read-only."
[env]
set = { OPENCODE_DISABLE_LSP_DOWNLOAD = "true" }

[[caches]]
path = "~/.local/share/opencode"

[[caches]]
path = "~/.local/state/opencode"

[[caches]]
path = "~/.cache/opencode"

[[mounts]]
path = "~/.config/opencode"
missing = "skip"

[[mounts]]
path = "~/.agents/skills"
missing = "skip"

[egress]
allow = ["models.dev", "opencode.ai"]

[[open]]
host = "claude.ai"
path = "/oauth/authorize"
action = "allow"
forward_redirect = true

[[open]]
host = "claude.com"
path = "/cai/oauth/authorize"
action = "allow"
forward_redirect = true

[[open]]
host = "auth.openai.com"
path = "/oauth/authorize"
action = "allow"
forward_redirect = true

[[open]]
host = "github.com"
path = "/login/device"
action = "allow"
