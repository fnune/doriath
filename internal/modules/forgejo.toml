description = "Forgejo and Gitea, on Codeberg by default, with a token that only git, tea, fj and berg get."
uses_secrets = ["forgejo"]

[env]
set = { GITEA_INSTANCE_URL = "https://codeberg.org", GITEA_TOKEN = "doriath-placeholder-token", BERG_TOKEN = "doriath-placeholder-token" }

[[http]]
host = "codeberg.org"
credential = { secret = "forgejo", scheme = "basic", username = "token", binaries = ["git-remote-https", "git-remote-http", "git", "git-lfs"] }
default = "approve"
repositories = ["/api/v1/repos/*/*"]
ssh = { user = "git" }

[[http.rules]]
method = "*"
path = "/api/v1/repos/*/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/repos/*/*/actions/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/repos/*/*/actions/variables/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/repos/*/*/collaborators/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/repos/*/*/keys/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/repos/*/*/actions/runners/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/repos/*/*/branch_protections/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/repos/*/*/push_mirrors/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/repos/*/*/push_mirrors-sync"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/repos/*/*/transfer/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/repos/*/*/teams/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/orgs/*/actions/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/orgs/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/user/actions/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/user/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/user/keys/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/user/gpg_keys/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v1/users/*/tokens/**"
action = "deny"

[[http.rules]]
method = "POST"
path = "/api/v1/repos/*/*/pulls/*/merge"
action = "approve"
summary = "Merge pull request"
subject = "{5}#{7}"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "POST"
path = "/api/v1/repos/*/*/releases"
action = "approve"
summary = "Create a release"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "POST"
path = "/api/v1/repos/*/*/tags"
action = "approve"
summary = "Create a tag"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "POST"
path = "/api/v1/repos/*/*/contents/**"
action = "approve"
summary = "Change files through the API"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "PUT"
path = "/api/v1/repos/*/*/contents/**"
action = "approve"
summary = "Change files through the API"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "DELETE"
path = "/api/v1/repos/*/*/contents/**"
action = "approve"
summary = "Change files through the API"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "*"
path = "/api/v1/admin/**"
action = "deny"

[[http.rules]]
method = "GET"
path = "/api/**"
action = "allow"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "HEAD"
path = "/api/**"
action = "allow"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "POST"
path = "/api/v1/repos/*/*/pulls"
action = "allow"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "PATCH"
path = "/api/v1/repos/*/*/pulls/*"
action = "allow"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "POST"
path = "/api/v1/repos/*/*/pulls/*/reviews/**"
body_contains = ["APPROVE"]
action = "approve"
summary = "Approve pull request"
subject = "{5}#{7}"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "POST"
path = "/api/v1/repos/*/*/pulls/*/reviews/**"
form = { event = "*APPROVE*" }
action = "approve"
summary = "Approve pull request"
subject = "{5}#{7}"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "POST"
path = "/api/v1/repos/*/*/pulls/*/reviews"
body_json = { event = ["COMMENT", "REQUEST_CHANGES"] }
action = "allow"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "POST"
path = "/api/v1/repos/*/*/pulls/*/reviews"
action = "approve"
summary = "Submit a review that is not a comment"
subject = "{5}#{7}"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "POST"
path = "/api/v1/repos/*/*/issues"
action = "allow"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "PATCH"
path = "/api/v1/repos/*/*/issues/*"
action = "allow"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "POST"
path = "/api/v1/repos/*/*/issues/*/comments"
action = "allow"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "PATCH"
path = "/api/v1/repos/*/*/issues/comments/*"
action = "allow"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "*"
path = "/api/**"
action = "approve"
credential = { secret = "forgejo", scheme = "token", binaries = ["tea", "fj", "berg"] }

[[http.rules]]
method = "PUT"
path = "/**/info/lfs/objects/**"
action = "allow"

[[http.rules]]
method = "GET"
path = "/**"
action = "allow"

[[http.rules]]
method = "HEAD"
path = "/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/git-upload-pack"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/objects/batch"
body_contains = ['"operation":"upload"', '"operation": "upload"']
action = "approve"
summary = "Upload Git LFS objects"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/objects/batch"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/locks/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/git-receive-pack"
action = "approve"
summary = "Push"

[[open]]
host = "codeberg.org"
path = "/user/**"
action = "approve"

[[open]]
host = "codeberg.org"
path = "/login/**"
action = "approve"

[[open]]
host = "codeberg.org"
path = "/admin/**"
action = "approve"

[[open]]
host = "codeberg.org"
path = "/org/**"
action = "approve"

[[open]]
host = "codeberg.org"
path = "/repo/**"
action = "approve"

[[open]]
host = "codeberg.org"
path = "/**"
action = "allow"
