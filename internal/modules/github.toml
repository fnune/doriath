# GitHub with a token the agent never sees, and that only gh and git get:
# any other program reaches these hosts without it. The proxy adds it to
# requests for these hosts. Reads and routine work on pull requests, issues
# and CI runs go through. Everything else waits for approval, and changes to
# webhooks, secrets, collaborators and deploy keys are refused. Say where
# the token comes from under [secrets.github] in the profile.

[egress]
allow = ["*.githubusercontent.com"]

# gh refuses to run without a token. This one only satisfies that check: the
# proxy replaces the whole Authorization header with the real token.
[env]
set = { GH_TOKEN = "doriath-placeholder-token" }

# git over HTTPS. Fetches pass, and each push waits for approval, which you
# can grant for the session per repository.
# Some builds, nix's among them, link git-remote-https to git-remote-http, and
# the kernel names the program by the file it runs.
[[http]]
host = "github.com"
credential = { secret = "github", scheme = "basic", username = "x-access-token", binaries = ["git-remote-https", "git-remote-http", "git"] }
default = "approve"

[[http.rules]]
method = "GET"
path = "/**"
action = "allow"

[[http.rules]]
method = "HEAD"
path = "/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/git-upload-pack"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/git-receive-pack"
action = "approve"
summary = "Push to a GitHub repository"

[[http]]
host = "api.github.com"
credential = { secret = "github", scheme = "bearer", binaries = ["gh"] }
default = "approve"
repositories = ["/repos/*/*", "/repositories/*"]

# Refused outright, in both path forms.
[[http.rules]]
method = "*"
path = "/repos/*/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/actions/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/environments/*/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/collaborators/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/keys/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/actions/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/environments/*/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/collaborators/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/keys/**"
action = "deny"

# Held with a summary that says what the request does. Anything else that is
# not allowed below is held too, with its method and path as the summary.
[[http.rules]]
method = "PUT"
path = "/repos/*/*/pulls/*/merge"
action = "approve"
summary = "Merge a pull request"

[[http.rules]]
method = "POST"
path = "/repos/*/*/releases"
action = "approve"
summary = "Create a GitHub release"

# Reads.
[[http.rules]]
method = "GET"
path = "/**"
action = "allow"

[[http.rules]]
method = "HEAD"
path = "/**"
action = "allow"

# Pull requests.
[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls"
action = "allow"

[[http.rules]]
method = "PATCH"
path = "/repos/*/*/pulls/*"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/comments/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/reviews/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/requested_reviewers"
action = "allow"

# Issues and comments.
[[http.rules]]
method = "POST"
path = "/repos/*/*/issues"
action = "allow"

[[http.rules]]
method = "PATCH"
path = "/repos/*/*/issues/*"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/issues/*/comments"
action = "allow"

[[http.rules]]
method = "PATCH"
path = "/repos/*/*/issues/comments/*"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/issues/*/labels"
action = "allow"

# CI runs.
[[http.rules]]
method = "POST"
path = "/repos/*/*/actions/runs/*/rerun"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/actions/runs/*/rerun-failed-jobs"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/actions/runs/*/cancel"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/actions/jobs/*/rerun"
action = "allow"

# GraphQL carries reads and writes on one path, so these rules read the
# operations in the body. Reads pass, routine pull request and issue writes
# pass, merges wait for approval with their own summary, and every other
# write falls to the host default and waits too.
[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "query" }
action = "allow"

[[http.rules]]
method = "POST"
path = "/graphql"
action = "allow"

[http.rules.graphql]
operation = "mutation"
fields = [
  "createPullRequest",
  "updatePullRequest",
  "markPullRequestReadyForReview",
  "convertPullRequestToDraft",
  "closePullRequest",
  "reopenPullRequest",
  "requestReviews",
  "addPullRequestReview",
  "submitPullRequestReview",
  "addPullRequestReviewComment",
  "addPullRequestReviewThread",
  "addPullRequestReviewThreadReply",
  "resolveReviewThread",
  "unresolveReviewThread",
  "addComment",
  "updateIssueComment",
  "minimizeComment",
  "createIssue",
  "updateIssue",
  "closeIssue",
  "reopenIssue",
  "addLabelsToLabelable",
  "removeLabelsFromLabelable",
  "addReaction",
  "removeReaction",
]

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "mutation", fields = ["mergePullRequest", "enablePullRequestAutoMerge", "mergeBranch"] }
action = "approve"
summary = "Merge a pull request"

[[http]]
host = "uploads.github.com"
credential = { secret = "github", scheme = "bearer", binaries = ["gh"] }
default = "approve"
repositories = ["/repos/*/*", "/repositories/*"]
