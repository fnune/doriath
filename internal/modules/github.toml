description = "GitHub with a token that only gh and git get, and that the agent never sees."
uses_secrets = ["github"]

[egress]
allow = ["*.githubusercontent.com"]

[env]
set = { GH_TOKEN = "doriath-placeholder-token" }

[[http]]
host = "github.com"
credential = { secret = "github", scheme = "basic", username = "x-access-token", binaries = ["git-remote-https", "git-remote-http", "git", "git-lfs"] }
default = "approve"
ssh = { user = "git" }

[[http.rules]]
method = "GET"
path = "/**"
action = "allow"

[[http.rules]]
method = "HEAD"
path = "/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/git-upload-pack"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/objects/batch"
body_contains = ['"operation":"upload"', '"operation": "upload"']
action = "approve"
summary = "Upload Git LFS objects"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/objects/batch"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/locks/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/git-receive-pack"
action = "approve"
summary = "Push"
link = { label = "Open branch", url = "https://github.com/{1}/{2}/tree/{ref}" }

[[http]]
host = "api.github.com"
credential = { secret = "github", scheme = "bearer", binaries = ["gh"] }
default = "approve"
repositories = ["/repos/*/*", "/repositories/*"]

[[http.rules]]
method = "*"
path = "/repos/*/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/actions/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/environments/*/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/collaborators/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/keys/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/secret-scanning/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/secret-scanning/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/orgs/*/secret-scanning/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/actions/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/environments/*/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/collaborators/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/keys/**"
action = "deny"

[[http.rules]]
method = "PUT"
path = "/repos/*/*/pulls/*/merge"
action = "approve"
summary = "Merge pull request"
subject = "{3}#{5}"
link = { label = "Open PR", url = "https://github.com/{2}/{3}/pull/{5}" }

[[http.rules]]
method = "POST"
path = "/repos/*/*/releases"
action = "approve"
summary = "Create a release"
subject = "{3}"
link = { label = "Open releases", url = "https://github.com/{2}/{3}/releases" }

[[http.rules]]
method = "GET"
path = "/**"
action = "allow"

[[http.rules]]
method = "HEAD"
path = "/**"
action = "allow"

[[http.rules]]
method = "*"
path = "/repos/*/*/dependabot/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/codespaces/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/dependabot/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/codespaces/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/orgs/*/actions/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/orgs/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/user/keys/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/user/gpg_keys/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/user/ssh_signing_keys/**"
action = "deny"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls"
action = "allow"

[[http.rules]]
method = "PATCH"
path = "/repos/*/*/pulls/*"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/comments/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/reviews/**"
body_contains = ["APPROVE"]
action = "approve"
summary = "Approve pull request"
subject = "{3}#{5}"
link = { label = "Open PR", url = "https://github.com/{2}/{3}/pull/{5}" }

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/reviews/**"
form = { event = "*APPROVE*" }
action = "approve"
summary = "Approve pull request"
subject = "{3}#{5}"
link = { label = "Open PR", url = "https://github.com/{2}/{3}/pull/{5}" }

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/reviews/**"
body_json = { event = ["COMMENT", "REQUEST_CHANGES"] }
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/reviews/**"
action = "approve"
summary = "Submit a review that is not a comment"
subject = "{3}#{5}"
link = { label = "Open PR", url = "https://github.com/{2}/{3}/pull/{5}" }

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/requested_reviewers"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/comments/*/reactions"
action = "approve"
summary = "React to a review comment"
subject = "{3}"

[[http.rules]]
method = "POST"
path = "/repos/*/*/issues/comments/*/reactions"
action = "approve"
summary = "React to a comment"
subject = "{3}"

[[http.rules]]
method = "POST"
path = "/repos/*/*/issues/*/reactions"
action = "approve"
summary = "React to an issue or pull request"
subject = "{3}#{5}"
link = { label = "Open issue", url = "https://github.com/{2}/{3}/issues/{5}" }

[[http.rules]]
method = "POST"
path = "/repos/*/*/stacks"
action = "approve"
summary = "Create a stack of pull requests"
subject = "{3}"

[[http.rules]]
method = "POST"
path = "/repos/*/*/stacks/*/add"
action = "approve"
summary = "Add to a stack of pull requests"
subject = "{3} stack {5}"

[[http.rules]]
method = "POST"
path = "/repos/*/*/stacks/*/unstack"
action = "approve"
summary = "Remove from a stack of pull requests"
subject = "{3} stack {5}"

[[http.rules]]
method = "POST"
path = "/repos/*/*/actions/workflows/*/dispatches"
action = "approve"
summary = "Run a workflow"
subject = "{3} workflow {6}"
link = { label = "Open workflow", url = "https://github.com/{2}/{3}/actions/workflows/{6}" }

[[http.rules]]
method = "POST"
path = "/repos/*/*/issues"
action = "allow"

[[http.rules]]
method = "PATCH"
path = "/repos/*/*/issues/*"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/issues/*/comments"
action = "allow"

[[http.rules]]
method = "PATCH"
path = "/repos/*/*/issues/comments/*"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/issues/*/labels"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/actions/runs/*/rerun"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/actions/runs/*/rerun-failed-jobs"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/actions/runs/*/cancel"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/actions/jobs/*/rerun"
action = "allow"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "query" }
action = "allow"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "mutation", fields = ["mergePullRequest"] }
action = "approve"
summary = "Merge pull request"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "mutation", fields = ["enablePullRequestAutoMerge"] }
action = "approve"
summary = "Turn on auto-merge"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "mutation", fields = ["mergeBranch"] }
action = "approve"
summary = "Merge a branch"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "mutation", fields = ["mergePullRequest", "enablePullRequestAutoMerge", "mergeBranch"] }
action = "approve"
summary = "Merge"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "mutation", fields = ["enqueuePullRequest"] }
action = "approve"
summary = "Add to the merge queue"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "mutation", fields = ["dequeuePullRequest"] }
action = "approve"
summary = "Remove from the merge queue"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "mutation", fields = ["requestReviewsByLogin"] }
action = "approve"
summary = "Request reviews"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "mutation" }
body_contains = ["APPROVE"]
action = "approve"
summary = "Approve pull request"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "mutation" }
body_contains = ["DISMISS"]
action = "approve"
summary = "Dismiss a pull request review"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "mutation", fields = ["dismissPullRequestReview"] }
action = "approve"
summary = "Dismiss a pull request review"

[[http.rules]]
method = "POST"
path = "/graphql"
action = "allow"

[http.rules.graphql]
operation = "mutation"
fields = [
  "createPullRequest",
  "updatePullRequest",
  "markPullRequestReadyForReview",
  "convertPullRequestToDraft",
  "closePullRequest",
  "reopenPullRequest",
  "requestReviews",
  "addPullRequestReview",
  "submitPullRequestReview",
  "addPullRequestReviewComment",
  "addPullRequestReviewThread",
  "addPullRequestReviewThreadReply",
  "resolveReviewThread",
  "unresolveReviewThread",
  "addComment",
  "updateIssueComment",
  "minimizeComment",
  "createIssue",
  "updateIssue",
  "closeIssue",
  "reopenIssue",
  "addLabelsToLabelable",
  "removeLabelsFromLabelable",
  "addReaction",
  "removeReaction",
]

[[http]]
host = "uploads.github.com"
credential = { secret = "github", scheme = "bearer", binaries = ["gh"] }
default = "approve"
repositories = ["/repos/*/*", "/repositories/*"]

[[open]]
host = "github.com"
path = "/login/**"
action = "approve"

[[open]]
host = "github.com"
path = "/sessions/**"
action = "approve"

[[open]]
host = "github.com"
path = "/settings/**"
action = "approve"

[[open]]
host = "github.com"
path = "/apps/**"
action = "approve"

[[open]]
host = "github.com"
path = "/organizations/**"
action = "approve"

[[open]]
host = "github.com"
path = "/**"
action = "allow"
