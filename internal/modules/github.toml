description = "GitHub with a token that only gh and git get, and that the agent never sees."
uses_secrets = ["github"]

[egress]
allow = ["*.githubusercontent.com"]

[env]
set = { GH_TOKEN = "doriath-placeholder-token" }

[[http]]
host = "github.com"
credential = { secret = "github", scheme = "basic", username = "x-access-token", binaries = ["git-remote-https", "git-remote-http", "git", "git-lfs"] }
default = "approve"
ssh = { user = "git" }

[[http.rules]]
method = "GET"
path = "/**"
action = "allow"

[[http.rules]]
method = "HEAD"
path = "/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/git-upload-pack"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/objects/batch"
body_contains = ['"operation":"upload"', '"operation": "upload"']
action = "approve"
summary = "Upload Git LFS objects"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/objects/batch"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/locks/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/git-receive-pack"
action = "approve"
summary = "Push to a GitHub repository"

[[http]]
host = "api.github.com"
credential = { secret = "github", scheme = "bearer", binaries = ["gh"] }
default = "approve"
repositories = ["/repos/*/*", "/repositories/*"]

[[http.rules]]
method = "*"
path = "/repos/*/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/actions/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/environments/*/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/collaborators/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/keys/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/actions/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/environments/*/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/collaborators/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/keys/**"
action = "deny"

[[http.rules]]
method = "PUT"
path = "/repos/*/*/pulls/*/merge"
action = "approve"
summary = "Merge a pull request"

[[http.rules]]
method = "POST"
path = "/repos/*/*/releases"
action = "approve"
summary = "Create a GitHub release"

[[http.rules]]
method = "GET"
path = "/**"
action = "allow"

[[http.rules]]
method = "HEAD"
path = "/**"
action = "allow"

[[http.rules]]
method = "*"
path = "/repos/*/*/dependabot/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repos/*/*/codespaces/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/dependabot/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/repositories/*/codespaces/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/orgs/*/actions/secrets/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/orgs/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/user/keys/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/user/gpg_keys/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/user/ssh_signing_keys/**"
action = "deny"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls"
action = "allow"

[[http.rules]]
method = "PATCH"
path = "/repos/*/*/pulls/*"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/comments/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/reviews/**"
body_contains = ["APPROVE"]
action = "approve"
summary = "Approve a pull request"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/reviews/**"
form = { event = "*APPROVE*" }
action = "approve"
summary = "Approve a pull request"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/reviews/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/pulls/*/requested_reviewers"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/issues"
action = "allow"

[[http.rules]]
method = "PATCH"
path = "/repos/*/*/issues/*"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/issues/*/comments"
action = "allow"

[[http.rules]]
method = "PATCH"
path = "/repos/*/*/issues/comments/*"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/issues/*/labels"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/actions/runs/*/rerun"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/actions/runs/*/rerun-failed-jobs"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/actions/runs/*/cancel"
action = "allow"

[[http.rules]]
method = "POST"
path = "/repos/*/*/actions/jobs/*/rerun"
action = "allow"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "query" }
action = "allow"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "mutation", fields = ["mergePullRequest", "enablePullRequestAutoMerge", "mergeBranch"] }
action = "approve"
summary = "Merge a pull request"

[[http.rules]]
method = "POST"
path = "/graphql"
graphql = { operation = "mutation" }
body_contains = ["APPROVE"]
action = "approve"
summary = "Approve a pull request"

[[http.rules]]
method = "POST"
path = "/graphql"
action = "allow"

[http.rules.graphql]
operation = "mutation"
fields = [
  "createPullRequest",
  "updatePullRequest",
  "markPullRequestReadyForReview",
  "convertPullRequestToDraft",
  "closePullRequest",
  "reopenPullRequest",
  "requestReviews",
  "addPullRequestReview",
  "submitPullRequestReview",
  "addPullRequestReviewComment",
  "addPullRequestReviewThread",
  "addPullRequestReviewThreadReply",
  "resolveReviewThread",
  "unresolveReviewThread",
  "addComment",
  "updateIssueComment",
  "minimizeComment",
  "createIssue",
  "updateIssue",
  "closeIssue",
  "reopenIssue",
  "addLabelsToLabelable",
  "removeLabelsFromLabelable",
  "addReaction",
  "removeReaction",
]

[[http]]
host = "uploads.github.com"
credential = { secret = "github", scheme = "bearer", binaries = ["gh"] }
default = "approve"
repositories = ["/repos/*/*", "/repositories/*"]

[[open]]
host = "github.com"
path = "/login/**"
action = "approve"

[[open]]
host = "github.com"
path = "/sessions/**"
action = "approve"

[[open]]
host = "github.com"
path = "/settings/**"
action = "approve"

[[open]]
host = "github.com"
path = "/apps/**"
action = "approve"

[[open]]
host = "github.com"
path = "/organizations/**"
action = "approve"

[[open]]
host = "github.com"
path = "/**"
action = "allow"
