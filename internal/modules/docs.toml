description = "Documentation sites that accept no writes, so the agent reads them without asking you."
[egress]
allow = [
  "go.dev",
  "pkg.go.dev",
  "docs.rs",
  "doc.rust-lang.org",
  "developer.mozilla.org",
  "docs.python.org",
  "nodejs.org",
  "www.typescriptlang.org",
  "*.readthedocs.io",
  "nixos.org",
  "search.nixos.org",
  "man7.org",
  "kubernetes.io",
  "docs.docker.com",
  "raw.githubusercontent.com",
]
