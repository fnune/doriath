# Commits, branches, git worktrees and jj workspaces in read-only
# repositories. The store of each repository becomes writable: git's
# objects, refs, logs and worktrees, and jj's operation log, index and
# working-copy state. The checkout stays read-only, and so does everything
# that decides what git or jj runs: config, hooks, info, commondir and jj's
# store pointers. doriath records your branches and bookmarks when a session
# starts, and `doriath restore` puts back what the agent moved.

[vcs]
store = true

# doriath request edit changes .git/config for the agent. These settings
# change without asking: upstream tracking, as git push -u records it, and
# the extension jj needs for a workspace. Any other change waits for you.
[[mounts]]
path = "{git}/config"
edit = { format = "git-config", safe = [
  "branch.*.remote = *",
  "branch.*.merge = refs/heads/**",
  "extensions.relativeworktrees = true",
  "core.repositoryformatversion = 1",
] }
