# Any other API request, including GraphQL, waits for approval.

[[http.rules]]
method = "*"
path = "/api/**"
action = "approve"
credential = { secret = "gitlab", scheme = "header", header = "PRIVATE-TOKEN", binaries = ["glab"] }

# git over HTTPS. Fetches pass, and each push waits for approval, which you
# can grant for the session per repository. A Git LFS upload waits at the
# batch request, which names the objects. An object that no pushed commit
# names publishes nothing, so the upload itself then passes.

[[http.rules]]
method = "PUT"
path = "/**/gitlab-lfs/objects/**"
action = "allow"

[[http.rules]]
method = "GET"
path = "/**"
action = "allow"

[[http.rules]]
method = "HEAD"
path = "/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/git-upload-pack"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/objects/batch"
body_contains = ['"operation":"upload"', '"operation": "upload"']
action = "approve"
summary = "Upload Git LFS objects"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/objects/batch"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/info/lfs/locks/**"
action = "allow"

[[http.rules]]
method = "POST"
path = "/**/git-receive-pack"
action = "approve"
summary = "Push to a GitLab repository"
