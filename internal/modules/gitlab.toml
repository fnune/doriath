description = "GitLab with a token that only glab, git and git-lfs get, and that the agent never sees."
uses_secrets = ["gitlab"]

[env]
set = { GITLAB_TOKEN = "doriath-placeholder-token" }

[egress]
allow = ["cdn.artifacts.gitlab-static.net"]

[[http]]
host = "gitlab.com"
credential = { secret = "gitlab", scheme = "basic", username = "oauth2", binaries = ["git-remote-https", "git-remote-http", "git", "git-lfs"] }
default = "approve"
repositories = ["/api/v4/projects/*"]
encoded_slashes = true
ssh = { user = "git" }

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/variables/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/members/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/deploy_keys/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/deploy_tokens/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/access_tokens/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/protected_branches/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/groups/**/variables/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/groups/**/members/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/groups/**/access_tokens/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/groups/**/deploy_tokens/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/remote_mirrors/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/integrations/**"
