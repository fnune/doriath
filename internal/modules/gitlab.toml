# Held with a summary that says what the request does.

[[http.rules]]
method = "PUT"
path = "/api/v4/projects/*"
action = "approve"
summary = "Change the project's settings"
credential = { secret = "gitlab", scheme = "header", header = "PRIVATE-TOKEN", binaries = ["glab"] }

[[http.rules]]
method = "POST"
path = "/api/v4/projects/*/repository/files/**"
action = "approve"
summary = "Change files through the API"
credential = { secret = "gitlab", scheme = "header", header = "PRIVATE-TOKEN", binaries = ["glab"] }

[[http.rules]]
method = "PUT"
path = "/api/v4/projects/*/repository/files/**"
action = "approve"
summary = "Change files through the API"
credential = { secret = "gitlab", scheme = "header", header = "PRIVATE-TOKEN", binaries = ["glab"] }

[[http.rules]]
