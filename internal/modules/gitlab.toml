# GitLab with a token the agent never sees, and that only glab, git and
# git-lfs get: any other program reaches gitlab.com without it. git sends it
# over basic auth and glab in the PRIVATE-TOKEN header. Reads and routine work on merge
# requests, issues and pipelines go through. Merges, releases, tags, pushes
# and other writes wait for approval, and changes to webhooks, CI variables,
# members, deploy keys, mirrors and access tokens are refused. Say where the token
# comes from under [secrets.gitlab] in the profile. For a self-hosted
# instance, copy this module under another name and change the host.

# glab refuses to run without a token. This one only satisfies that check:
# the proxy replaces the PRIVATE-TOKEN header with the real token.
uses_secrets = ["gitlab"]

[env]
set = { GITLAB_TOKEN = "doriath-placeholder-token" }

# Job artifacts download from GitLab's CDN, where the API redirects.
[egress]
allow = ["cdn.artifacts.gitlab-static.net"]

[[http]]
host = "gitlab.com"
credential = { secret = "gitlab", scheme = "basic", username = "oauth2", binaries = ["git-remote-https", "git-remote-http", "git", "git-lfs"] }
default = "approve"
repositories = ["/api/v4/projects/*"]
encoded_slashes = true
ssh = { user = "git" }

# The API. Each rule that lets a request through carries glab's
# credential, because git's basic credential does not work there.

# Refused outright.

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/hooks/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/variables/**"
action = "deny"

[[http.rules]]
