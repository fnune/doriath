[[http.rules]]
method = "PUT"
path = "/api/v4/projects/*"
action = "approve"
summary = "Change the project's settings"
credential = { secret = "gitlab", scheme = "header", header = "PRIVATE-TOKEN", binaries = ["glab"] }

[[http.rules]]
method = "POST"
path = "/api/v4/projects/*/repository/files/**"
action = "approve"
summary = "Change files through the API"
credential = { secret = "gitlab", scheme = "header", header = "PRIVATE-TOKEN", binaries = ["glab"] }

[[http.rules]]
method = "PUT"
path = "/api/v4/projects/*/repository/files/**"
action = "approve"
summary = "Change files through the API"
credential = { secret = "gitlab", scheme = "header", header = "PRIVATE-TOKEN", binaries = ["glab"] }

[[http.rules]]
method = "DELETE"
path = "/api/v4/projects/*/repository/files/**"
action = "approve"
summary = "Change files through the API"
credential = { secret = "gitlab", scheme = "header", header = "PRIVATE-TOKEN", binaries = ["glab"] }

[[http.rules]]
method = "PUT"
path = "/api/v4/projects/*/merge_requests/*/merge"
action = "approve"
