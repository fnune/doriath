path = "/api/v4/projects/*/push_rule/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/share/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/invitations/**"
action = "deny"

[[http.rules]]
method = "*"
path = "/api/v4/projects/*/transfer"
