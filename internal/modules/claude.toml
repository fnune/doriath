description = "Claude Code, with its own login, your settings read-only and claude.ai connectors off."
[env]
set = { DISABLE_AUTOUPDATER = "1", DISABLE_ERROR_REPORTING = "1", DISABLE_FEEDBACK_COMMAND = "1" }

[egress]
allow = ["console.anthropic.com", "claude.ai", "platform.claude.com"]
deny = ["downloads.claude.ai", "mcp-proxy.anthropic.com", "*.datadoghq.com"]
notes = { "mcp-proxy.anthropic.com" = "Claude Code reaches claude.ai connectors through this host. Connectors reach your accounts through Anthropic, where doriath cannot see the calls.", "downloads.claude.ai" = "Claude Code downloads its updates from this host. A jailed Claude has nothing to update.", "*.datadoghq.com" = "Claude Code sends usage events to Datadog. doriath refuses them, so that Claude can still fetch its feature flags." }

[[caches]]
path = "~/.claude"

[[mounts]]
path = "~/.claude/CLAUDE.md"
missing = "skip"

[[mounts]]
path = "~/.claude/keybindings.json"
missing = "skip"

[[mounts]]
path = "~/.claude/statusline.sh"
missing = "skip"

[[mounts]]
path = "~/.claude/agents"
missing = "skip"

[[mounts]]
path = "~/.claude/commands"
missing = "skip"

[[mounts]]
path = "~/.claude/hooks"
missing = "skip"

[[mounts]]
path = "~/.claude/output-styles"
missing = "skip"

[[mounts]]
path = "~/.claude/skills"
missing = "skip"

[[mounts]]
path = "~/.claude/chrome"
missing = "skip"

[[mounts]]
path = "{repository}/.claude/worktrees"
mode = "write"

[[http]]
host = "api.anthropic.com"
default = "allow"

[[http.rules]]
method = "*"
path = "/**"
header = "x-api-key"
action = "deny"
summary = "Use an API key instead of the profile's Claude login"

[[http.rules]]
method = "*"
path = "/**"
header = "authorization"
header_prefix = "Bearer sk-ant-a"
action = "deny"
summary = "Use an API key instead of the profile's Claude login"

[[http.rules]]
method = "POST"
path = "/api/event_logging/**"
action = "deny"
summary = "Send usage events to Anthropic"

[claude]
disable_connectors = true
ask = [
  "mcp__claude-in-chrome__javascript_tool",
  "mcp__claude-in-chrome__file_upload",
]

[[open]]
host = "claude.com"
path = "/cai/oauth/authorize"
action = "allow"
forward_redirect = true

[[open]]
host = "platform.claude.com"
path = "/oauth/authorize"
action = "allow"
forward_redirect = true
