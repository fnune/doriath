description = "Claude Code, with a login that doriath holds, your settings read-only and claude.ai connectors off."
uses_secrets = ["claude"]

# The endpoints and the client ID are the public constants of Claude Code's
# login. Run doriath profiles login PROFILE once, and every profile with this
# module shares the login. A profile that gives its own [secrets.claude]
# replaces this one.
[secrets.claude]
required = true

[secrets.claude.oauth]
authorize_url = "https://claude.com/cai/oauth/authorize"
token_url = "https://platform.claude.com/v1/oauth/token"
token_body = "json"
client_id = "9d1c250a-e61b-44d9-88ed-5944d1962f5e"
scopes = ["user:inference", "user:profile"]
[env]
# Claude Code sends this placeholder, and the proxy replaces it with the login.
set = { CLAUDE_CODE_OAUTH_TOKEN = "doriath-placeholder", DISABLE_AUTOUPDATER = "1", DISABLE_ERROR_REPORTING = "1", DISABLE_FEEDBACK_COMMAND = "1" }

[egress]
allow = ["console.anthropic.com", "claude.ai", "platform.claude.com", "bridge.claudeusercontent.com"]
deny = ["downloads.claude.ai", "mcp-proxy.anthropic.com", "*.datadoghq.com"]
notes = { "bridge.claudeusercontent.com" = "Claude in Chrome reaches the Chrome extension through this host. The browser then acts with your sign-ins, outside the proxy.", "mcp-proxy.anthropic.com" = "Claude Code reaches claude.ai connectors through this host. Connectors reach your accounts through Anthropic, where doriath cannot see the calls.", "downloads.claude.ai" = "Claude Code downloads its updates from this host. A jailed Claude has nothing to update.", "*.datadoghq.com" = "Claude Code sends usage events to Datadog. doriath refuses them, so that Claude can still fetch its feature flags." }

[[caches]]
path = "~/.claude"

[[mounts]]
path = "~/.claude/CLAUDE.md"
missing = "skip"

[[mounts]]
path = "~/.claude/keybindings.json"
missing = "skip"

[[mounts]]
path = "~/.claude/statusline.sh"
missing = "skip"

[[mounts]]
path = "~/.claude/agents"
missing = "skip"

[[mounts]]
path = "~/.claude/commands"
missing = "skip"

[[mounts]]
path = "~/.claude/hooks"
missing = "skip"

[[mounts]]
path = "~/.claude/output-styles"
missing = "skip"

[[mounts]]
path = "~/.claude/skills"
missing = "skip"

[[mounts]]
path = "~/.claude/chrome"
missing = "skip"

[[mounts]]
path = "/tmp/claude-mcp-browser-bridge-{user}"
missing = "skip"

[[mounts]]
path = "{repository}/.claude/worktrees"
mode = "write"

[[http]]
host = "api.anthropic.com"
default = "allow"
credential = { secret = "claude", scheme = "bearer", binaries = ["claude"] }

[[http.rules]]
method = "*"
path = "/**"
header = "x-api-key"
action = "deny"
summary = "Use an API key instead of the profile's Claude login"

[[http.rules]]
method = "*"
path = "/**"
header = "authorization"
header_prefix = "Bearer sk-ant-a"
action = "deny"
summary = "Use an API key instead of the profile's Claude login"

[[http.rules]]
method = "POST"
path = "/api/event_logging/**"
action = "deny"
summary = "Send usage events to Anthropic"

# Claude in Chrome sends the login in oauth_token, in the first message that
# it sends on its WebSocket to the bridge. The proxy replaces what it sends.
[[http]]
host = "bridge.claudeusercontent.com"
default = "allow"
credential = { secret = "claude", scheme = "websocket", field = "oauth_token", binaries = ["claude"] }

# Claude Code sends the login to claude.ai for account calls. It also sends it
# to mcp-proxy.anthropic.com, which stays denied with the connectors.
[[http]]
host = "claude.ai"
default = "allow"
credential = { secret = "claude", scheme = "bearer", binaries = ["claude"] }

[claude]
disable_connectors = true
ask = [
  "mcp__claude-in-chrome__javascript_tool",
  "mcp__claude-in-chrome__file_upload",
]
