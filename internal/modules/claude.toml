# Claude Code. Connectors are off and Chrome tools that act on pages ask
# first. The Chrome bridge host is not allowed, so claude-in-chrome stays off
# unless a profile adds it.

[env]
set = { DISABLE_AUTOUPDATER = "1", CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1" }

[egress]
allow = ["console.anthropic.com", "claude.ai"]

# Claude Code's own worktrees (claude --worktree, EnterWorktree). With the
# vcs module, the agent adds them to a read-only repository and works there.
[[mounts]]
path = "{repository}/.claude/worktrees"
mode = "write"

# Claude uses the profile's login. A request that carries an API key, such as
# one the agent found or brought, could send the project to another account,
# so it is refused. A profile that runs Claude with ANTHROPIC_API_KEY allows
# it again with its own rule for api.anthropic.com: profile rules come first.
[[http]]
host = "api.anthropic.com"
default = "allow"

[[http.rules]]
method = "*"
path = "/**"
header = "x-api-key"
action = "deny"
summary = "Use an API key instead of the profile's Claude login"

[claude]
disable_connectors = true
statusline = true
ask = [
  "mcp__claude-in-chrome__javascript_tool",
  "mcp__claude-in-chrome__file_upload",
]
