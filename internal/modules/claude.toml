# Claude Code. Connectors are off and Chrome tools that act on pages ask
# first. The Chrome bridge host is not allowed, so claude-in-chrome stays off
# unless a profile adds it.

[env]
set = { DISABLE_AUTOUPDATER = "1", CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1" }

[egress]
allow = ["console.anthropic.com", "claude.ai"]

# The profile's own ~/.claude: its login, state and MCP servers, which the
# claude adapter points Claude at with CLAUDE_CONFIG_DIR. Your servers and
# login stay out; run claude mcp add or /login in a session to set them for
# the profile. To share your login instead, a profile adds
# ~/.claude/.credentials.json with mode = "write", which lets the agent read
# the token or swap in another account.
[[caches]]
path = "~/.claude"

# Your configuration, read-only, inside it.
[[mounts]]
path = "~/.claude/CLAUDE.md"
optional = true

[[mounts]]
path = "~/.claude/settings.json"
optional = true

[[mounts]]
path = "~/.claude/keybindings.json"
optional = true

[[mounts]]
path = "~/.claude/statusline.sh"
optional = true

[[mounts]]
path = "~/.claude/agents"
optional = true

[[mounts]]
path = "~/.claude/commands"
optional = true

[[mounts]]
path = "~/.claude/hooks"
optional = true

[[mounts]]
path = "~/.claude/output-styles"
optional = true

[[mounts]]
path = "~/.claude/plugins"
optional = true

[[mounts]]
path = "~/.claude/skills"
optional = true

[[mounts]]
path = "~/.claude/chrome"
optional = true

# Claude Code's own worktrees (claude --worktree, EnterWorktree). With the
# vcs module, the agent adds them to a read-only repository and works there.
[[mounts]]
path = "{repository}/.claude/worktrees"
mode = "write"

# Claude uses the profile's login. A request that carries an API key, such as
# one the agent found or brought, could send the project to another account,
# so it is refused. A profile that runs Claude with ANTHROPIC_API_KEY allows
# it again with its own rule for api.anthropic.com: profile rules come first.
[[http]]
host = "api.anthropic.com"
default = "allow"

[[http.rules]]
method = "*"
path = "/**"
header = "x-api-key"
action = "deny"
summary = "Use an API key instead of the profile's Claude login"

[claude]
disable_connectors = true
statusline = true
ask = [
  "mcp__claude-in-chrome__javascript_tool",
  "mcp__claude-in-chrome__file_upload",
]
