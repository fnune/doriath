description = "OpenAI's Codex CLI, with its own login and your instructions read-only."
[[caches]]
path = "~/.codex"

[[mounts]]
path = "~/.codex/AGENTS.md"
missing = "skip"

[[mounts]]
path = "~/.codex/skills"
missing = "skip"

[[mounts]]
path = "~/.codex/prompts"
missing = "skip"

[[mounts]]
path = "~/.agents/skills"
missing = "skip"

[egress]
allow = ["auth.openai.com", "chatgpt.com", "api.openai.com"]
