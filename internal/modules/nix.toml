# Caches and hosts for nix tools that run in the jail. The nix daemon itself
# is not reachable: add the nix-daemon module for that.

[[caches]]
path = "~/.cache/nix"

[egress]
allow = [
  "cache.nixos.org",
  "channels.nixos.org",
  "releases.nixos.org",
  "tarballs.nixos.org",
  "codeload.github.com",
]
